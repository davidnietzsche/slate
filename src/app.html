  menu.setAttribute("role", "listbox")
  const nx = nextStage(cur)
  menu.innerHTML = (nx ? `<button type="button" class="opt go" role="option" data-v="${nx}"><span>${ic("arrow-right", 13, "", "stroke-width:2.4")}下一步</span><b>${sIc(nx, 15)}${STAGE[nx]}</b></button>` : "") + `<h5>移到</h5>` + STAGES.map(([k, l]) => `<button type="button" class="opt ${k === cur ? "sel" : ""} ${k === "binned" ? "bin" : ""}" role="option" aria-selected="${k === cur}" data-v="${k}" style="${sv(k)}" title="${HINT[k]}">${sIc(k, 15)}<b>${l}</b><small>${HINT[k]}</small>${I.check}</button>`).join("")
  let scrim = null
  if (mobile) { scrim = document.createElement("div"); scrim.className = "scrim"; scrim.onclick = () => closeMenu(); document.body.appendChild(scrim) }
  document.body.appendChild(menu)
  if (!mobile) {
    const r = btn.getBoundingClientRect(), mh = menu.offsetHeight, mw = menu.offsetWidth
    let top = r.bottom + 6
    if (top + mh > innerHeight - 8 && r.top - mh - 6 > 8) { top = r.top - mh - 6; menu.classList.add("up") }
    menu.style.top = top + "px"
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 8)) + "px"
  }
  btn.setAttribute("aria-expanded", "true")
  const opts = [...menu.querySelectorAll(".opt")]
  let i = Math.max(0, opts.findIndex((o) => o.dataset.v === cur))
  const setActive = (n) => { i = (n + opts.length) % opts.length; opts.forEach((o, j) => o.classList.toggle("active", j === i)); opts[i].focus({ preventScroll: true }); const o = opts[i]; if (o.offsetTop < menu.scrollTop) menu.scrollTop = o.offsetTop - 6; else if (o.offsetTop + o.offsetHeight > menu.scrollTop + menu.clientHeight) menu.scrollTop = o.offsetTop + o.offsetHeight - menu.clientHeight + 6 }
  const pick = async (v) => { closeMenu(true); if (v === cur) return; await save(byStem[btn.dataset.stem], { status: v }); route() }
  menu.onclick = (e) => { const o = e.target.closest(".opt"); if (o) pick(o.dataset.v) }
  menu.onmousemove = (e) => { const o = e.target.closest(".opt"); if (o && opts.indexOf(o) !== i) { i = opts.indexOf(o); opts.forEach((x, j) => x.classList.toggle("active", j === i)) } }
  const key = (e) => {
    if (e.key === "Escape") { e.preventDefault(); closeMenu(true) }
    else if (e.key === "ArrowDown") { e.preventDefault(); setActive(i + 1) }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(i - 1) }
    else if (e.key === "Home") { e.preventDefault(); setActive(0) }
    else if (e.key === "End") { e.preventDefault(); setActive(opts.length - 1) }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(opts[i].dataset.v) }
    else if (e.key === "Tab") closeMenu()
  }
  document.addEventListener("keydown", key, true)
  openDD = { btn, menu, scrim, key, hover: !!hover }
  if (hover) opts.forEach((o, j) => o.classList.toggle("active", j === i))   // opened by hover: don't steal focus
  else setActive(i)
}
// Desktop: hovering the stage field (side panel) opens its menu; moving away closes it unless it was clicked open.
const canHover = matchMedia("(hover:hover) and (pointer:fine)")
let ddHoverT = null
document.addEventListener("mouseover", (e) => {
  if (!canHover.matches) return
  const b = e.target.closest?.(".dd-btn:not(.pill)")
  if (b || (openDD && openDD.hover && e.target.closest?.(".menu"))) {
    clearTimeout(ddHoverT)
    if (b && (!openDD || openDD.btn !== b)) ddHoverT = setTimeout(() => { if (b.isConnected && b.matches(":hover")) openMenu(b, true) }, 120)
    return
  }
  clearTimeout(ddHoverT)
  if (openDD && openDD.hover) ddHoverT = setTimeout(() => { if (openDD && openDD.hover) closeMenu() }, 220)
})

// ---------- card peek (desktop board): hover a card → its 提词器 text + one-click approve / next stage ----------
let peekEl = null, peekT = null, peekFor = null
function peekClose() { clearTimeout(peekT); peekEl?.remove(); peekEl = null; peekFor = null }
function peekOpen(card) {
  const s = byStem[card.dataset.stem]
  if (!s) return
  peekClose()
  const beats = prompter(s.md), x = st(s), nx = nextStage(x.status)
  const chars = beats.reduce((n, b) => n + b.lines.join("").length, 0)
  const el = document.createElement("div")
  el.className = "peek"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "提词器预览")
  el.innerHTML = `<div class="peek-h">${I.prompter}<b>提词器</b><small>${beats.length ? `${chars} 字` : ""}</small></div>
    <div class="peek-t">${beats.length ? prompterHtml(beats) : `<p class="none">这支还没有口播</p>`}</div>
    <div class="peek-f"><a class="btn" href="${sUrl(s)}" data-link>${I.doc}打开</a>${nx && canEdit ? `<button type="button" class="btn primary" data-approve="${esc(s.stem)}" data-to="${nx}" style="${sv(nx)}">${sIc(nx, 14)}${x.status === STAGES[0][0] ? "通过" : "下一步"} → ${STAGE[nx]}</button>` : ""}</div>`
  document.body.appendChild(el)
  const r = card.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight
  let left = r.right + 10
  if (left + w > innerWidth - 8) left = r.left - w - 10
  el.style.left = Math.max(8, left) + "px"
  el.style.top = Math.max(8, Math.min(r.top - 6, innerHeight - h - 8)) + "px"
  el.onclick = async (e) => {
    const b = e.target.closest("[data-approve]")
    if (!b) return
    b.disabled = true
    await save(byStem[b.dataset.approve], { status: b.dataset.to }, true)
    toast(`已移到「${STAGE[b.dataset.to]}」`)
    peekClose(); route()
  }
  peekEl = el; peekFor = card
}
document.addEventListener("mouseover", (e) => {
  if (!canHover.matches || openDD || document.querySelector(".card.dragging")) return
  const card = e.target.closest?.(".board .card")
  if ((peekEl && e.target.closest?.(".peek")) || (card && card === peekFor)) { clearTimeout(peekT); return }
  clearTimeout(peekT)
  if (card) { peekT = setTimeout(() => { if (card.isConnected && card.matches(":hover")) peekOpen(card) }, peekEl ? 150 : 450); return }
  if (peekEl) peekT = setTimeout(peekClose, 220)
})
document.addEventListener("scroll", (e) => { if (peekEl && !(e.target instanceof Element && e.target.closest(".peek"))) peekClose() }, true)
document.addEventListener("dragstart", () => peekClose())
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && peekEl) peekClose() })
document.addEventListener("keydown", (e) => {
  const b = e.target.closest?.(".dd-btn")
  if (b && !openDD && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); openMenu(b) }
})
document.addEventListener("scroll", (e) => { if (openDD && !(e.target instanceof Element && e.target.closest(".menu"))) closeMenu() }, true)
window.addEventListener("resize", () => closeMenu())

// ---------- mobile rail drawer ----------
let railScrim = null
function openRail() {
  $("#rail").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true")
  railScrim = document.createElement("div"); railScrim.className = "scrim"; railScrim.style.zIndex = 125; railScrim.onclick = closeRail; document.body.appendChild(railScrim)
}
function closeRail() {
  $("#rail").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false")
  railScrim?.remove(); railScrim = null
}
$("#menuBtn").onclick = openRail
$("#railX").onclick = closeRail

document.addEventListener("click", (e) => {
  const ddb = e.target.closest(".dd-btn")
  if (ddb) { e.preventDefault(); e.stopPropagation(); clearTimeout(ddHoverT); if (openDD?.btn === ddb && openDD.hover) { openDD.hover = false; return } openDD?.btn === ddb ? closeMenu() : openMenu(ddb); return }
  if (openDD && !e.target.closest(".menu")) closeMenu()
  const lane = e.target.closest("[data-lane]")
  if (lane) {
    e.preventDefault()
    if (isPhone()) store.set("slate-mstage", lane.dataset.lane)
    if (current().v !== "board") go(vUrl("board")); else { closeRail(); if (isPhone()) { route(); window.scrollTo(0, 0) } }
    if (!isPhone()) setTimeout(() => jumpTo(lane.dataset.lane), 60)
    return
  }
  const a = e.target.closest("a[data-link]")
  if (a && !e.defaultPrevented && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) { e.preventDefault(); go(a.getAttribute("href")); return }
  const tg = e.target.closest("[data-toggle]")
  if (tg) { const k = tg.dataset.toggle; setCollapsed(k, !isCol(k)); route(); return }
  const ms = e.target.closest("[data-mstage]")
  if (ms) { store.set("slate-mstage", ms.dataset.mstage); route(); document.querySelector(`[data-mstage="${ms.dataset.mstage}"]`)?.scrollIntoView({ inline: "center", block: "nearest" }); return }
  const mo = e.target.closest("[data-more]")
  if (mo) { more.add(mo.dataset.more); route(); return }
  if (e.target.closest("[data-expand-all]")) { collapsed = new Set(); store.set("slate-collapsed", []); store.set("slate-bin-open", true); route(); return }
  if (e.target.closest("[data-collapse-empty]")) { const { by } = boardData(); STAGES.forEach(([k]) => { if (!by[k].length) setCollapsed(k, true) }); route(); return }
  const j = e.target.closest("[data-jump]")
  if (j) { jumpTo(j.dataset.jump); return }
  const m = e.target.closest("[data-month]")
  if (m) { window._month = +m.dataset.month === 0 ? 0 : (window._month || 0) + +m.dataset.month; route() }
})
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && railScrim) closeRail() })
// Esc on a script / guide page goes back (看板, or 报告与计划 for reports) — unless Esc is closing something first
// or you're typing in a field (then it just leaves the field).
addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.defaultPrevented || current().v !== "s") return
  if (openDD || railScrim || !$("#bellPop").hidden || !$("#wsMenu").hidden || document.querySelector(".stage, .menu")) return
  if (e.target.closest?.("input, textarea, select, [contenteditable]")) { e.target.blur(); return }
  const back = document.querySelector(".toolbar a.pill[data-link]")
  if (back) go(back.getAttribute("href"))
}, true)
window.addEventListener("popstate", () => { closeMenu(); closeRail(); route() })
window.addEventListener("hashchange", () => { legacyHash(); closeMenu(); route() })
matchMedia("(max-width:760px)").addEventListener("change", () => { closeMenu(); closeRail(); route() })

// back-to-top button + the section bar's lit chip, updated once per frame while scrolling
$("#totop").onclick = () => scrollTo({ top: 0, behavior: "smooth" })
let scrollTick = false
addEventListener("scroll", () => {
  if (scrollTick) return
  scrollTick = true
  requestAnimationFrame(() => { scrollTick = false; const on = scrollY > innerHeight * 1.5; $("#totop").classList.toggle("on", on); $("#totop").tabIndex = on ? 0 : -1; tocActive(); outlineActive() })
}, { passive: true })

$("#wsName").textContent = CFG.workspaceName || CFG.workspace
// workspace switcher: every vertical is its own workspace on this site (full page load, own board)
;(() => {
  const list = CFG.workspaces || [], btn = $("#wsBtn"), menu = $("#wsMenu")
  if (list.length < 2) { btn.disabled = true; return }
  menu.innerHTML = list.map((w) => `<a href="${esc(w.href)}"${w.ws === CFG.workspace ? ' class="on" aria-current="true"' : ""}><i>${esc(w.name[0].toUpperCase())}</i><span>${esc(w.name)}</span></a>`).join("")
  const set = (open) => { menu.hidden = !open; btn.setAttribute("aria-expanded", String(open)) }
  btn.onclick = (e) => { e.stopPropagation(); set(menu.hidden) }
  document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) set(false) })
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) { set(false); btn.focus() } })
})()
accountBox()
$("#pjName").textContent = CFG.projectLabel || CFG.project.replace(/-/g, " ")
if (CFG.listLabel) document.querySelector('.nav[data-v="list"] .lbl').textContent = CFG.listLabel
if (CFG.docsLabel) document.querySelector('.nav[data-v="docs"] .lbl').textContent = CFG.docsLabel
for (const v of CFG.hideNav || []) { const a = document.querySelector(`.nav[data-v="${v}"]`); if (a) a.style.display = "none" }
// collapsible rail (desktop): icon-only when folded, names show as tooltips
document.querySelectorAll(".rail .nav[data-v]").forEach((a) => { a.title = a.querySelector(".lbl")?.textContent || "" })
const railMin = (on) => {
  $(".app").classList.toggle("rail-min", on)
  for (const t of [$("#railTg"), $("#railFold")]) { t.setAttribute("aria-expanded", String(!on)); t.setAttribute("aria-label", on ? "展开侧栏" : "收起侧栏"); t.title = on ? "展开侧栏" : "收起侧栏" }
  store.set("slate-rail-min", on)
}
railMin(store.get("slate-rail-min", false))
$("#railTg").onclick = $("#railFold").onclick = () => railMin(!$(".app").classList.contains("rail-min"))
// 方法 / Stages groups in the rail fold on their title, remembered per browser
const folds = new Set(store.get("slate-rail-folds", []))
document.querySelectorAll("[data-fold]").forEach((h) => {
  const g = document.getElementById(h.dataset.fold)
  const set = (on) => { g.classList.toggle("folded", on); h.setAttribute("aria-expanded", String(!on)); on ? folds.add(g.id) : folds.delete(g.id) }
  set(folds.has(g.id))
  h.onclick = () => { set(!g.classList.contains("folded")); store.set("slate-rail-folds", [...folds]) }
})
legacyHash()
load()
</script>
