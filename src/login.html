<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>登录 · Slate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23F5F6FB'/%3E%3Cg fill='none' stroke='%2316172E' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cellipse cx='16' cy='16' rx='9' ry='5.6'/%3E%3Cpath d='M21.1 13.9 19.2 16l1.9 2.1'/%3E%3C/g%3E%3Crect x='12' y='13.3' width='1.8' height='5.4' rx='.9' fill='%2316172E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* design tokens */
:root{
  --ink:#16172E;--ink-soft:#43466A;--muted:#7A7E9C;--paper:#FFFFFF;--wash:#F5F6FB;--line:#E7E9F4;--line-soft:#EEF0F8;
  --blue:#2F54FF;--blue-deep:#1B34C7;--blue-wash:#EDF0FF;--pink:#D6467B;--pink-wash:#FBE7EF;--amber-wash:#FDF3E4;--amber-ink:#B0700F;
  --font-display:'Bricolage Grotesque','Noto Sans SC','PingFang SC',sans-serif;
  --font-body:'IBM Plex Sans','Noto Sans SC','PingFang SC',-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','Noto Sans SC',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;background:var(--wash);color:var(--ink);font:13px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto}
:focus-visible{outline:3px solid rgba(47,84,255,.32);outline-offset:2px}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-deep)}
header{height:42px;display:flex;align-items:center;gap:9px;padding:0 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mk{width:26px;height:26px;border-radius:8px;background:var(--wash);display:grid;place-items:center;flex:none}
.brand{font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:-.02em}
.crumb{font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main{display:grid;place-items:center;padding:24px 16px}
.card{width:min(400px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 42px -28px rgba(47,84,255,.55)}
.tile{width:42px;height:42px;border-radius:13px;background:var(--blue-wash);color:var(--blue);display:grid;place-items:center}
.tile.warn{background:var(--amber-wash);color:var(--amber-ink)}
h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.12;margin:16px 0 6px}
p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
p b{color:var(--ink);font-weight:600}
label{display:block;margin:20px 0 7px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:500 16px/1.3 var(--font-body);color:var(--ink);background:#fff;transition:border-color .18s,box-shadow .18s}
input:hover{border-color:#C9CEE3}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,84,255,.16)}
input.code{font:600 24px/1.2 var(--font-mono);letter-spacing:.42em;text-align:center;padding:12px 12px 12px 22px}
.err{display:flex;align-items:center;gap:8px;margin-top:14px;padding:8px 11px;border-radius:10px;background:var(--pink-wash);color:#B02D5F;font-size:12px;font-weight:600}
.btn{margin-top:14px;width:100%;border:0;border-radius:11px;padding:11px 12px;background:var(--blue);color:#fff;font:600 14.5px/1.3 var(--font-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .18s,transform .18s}
.btn:hover{background:var(--blue-deep);transform:translateY(-1px)}
.btn:active{transform:scale(.996)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--wash)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:12px}
.link{background:none;border:0;padding:0;font:600 12px/1.4 var(--font-body);color:var(--blue);cursor:pointer}
.note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)}
footer{padding:14px 16px 18px;text-align:center;font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#A9AEC4}
/* phones */
@media (max-width:600px){main{place-items:start center;padding:9vh max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}footer{padding-bottom:calc(18px + env(safe-area-inset-bottom))}button{min-height:46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="mk"><svg width="20" height="20" viewBox="0 0 1024 1024" aria-hidden="true"><g fill="none" stroke="#16172E" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="512" cy="512" rx="286" ry="178"/><path d="M676 444 614 512 676 580"/></g><rect x="386" y="426" width="56" height="172" rx="28" fill="#16172E"/></svg></span>
  <span class="brand">Slate</span>
</header>
<main>
  <div class="card">
    <section {{hide_email}}>
      <span class="tile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.6"/><path d="m4.5 7 7.5 6 7.5-6"/></svg></span>
      <h1>用邮箱登录</h1>
      <p>不需要密码。我们会寄一个 6 位数验证码到你的邮箱。</p>
      <form method="post" action="/auth/otp/start">
        <label for="email">邮箱 · Email</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com" value="{{email}}">
        <input type="hidden" name="next" value="{{next}}">
        <div class="err" role="alert" {{hide_error}}>{{error}}</div>
        <button class="btn" type="submit">发送验证码<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <div class="note">只有被邀请的邮箱才能进入工作区。还没被邀请？请工作区的所有者把你的邮箱加进成员。</div>
    </section>

    <section {{hide_code}}>
      <span class="tile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.4"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><path d="M12 14.4v2"/></svg></span>
      <h1>输入验证码</h1>
      <p>如果 <b>{{masked}}</b> 已被邀请，验证码会在一分钟内送到，10 分钟内有效。</p>
      <form method="post" action="/auth/otp/verify">
        <label for="code">6 位数验证码 · Code</label>
        <input class="code" id="code" name="code" required autofocus inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000">
        <input type="hidden" name="email" value="{{email}}">
        <input type="hidden" name="next" value="{{next}}">
        <div class="err" role="alert" {{hide_error}}>{{error}}</div>
        <button class="btn" type="submit">登录</button>
      </form>
      <form class="row" method="post" action="/auth/otp/start">
        <input type="hidden" name="email" value="{{email}}"><input type="hidden" name="next" value="{{next}}">
        <a href="/login?next={{next_q}}">换个邮箱</a>
        <button class="link" type="submit">没收到？重新发送</button>
      </form>
    </section>

    <section {{hide_denied}}>
      <span class="tile warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.8v5M12 16.2h.01"/></svg></span>
      <h1>还没有权限</h1>
      <p><b>{{email}}</b> 还不是 <b>{{ws}}</b> 的成员。请工作区的所有者邀请这个邮箱，或者换一个邮箱登录。</p>
      <a class="btn ghost" href="/auth/logout">换个邮箱登录</a>
    </section>
  </div>
</main>
<footer>Slate · Private workspace</footer>
</body>
</html>
